
<section class="register-card">
  <div class="form-heading">
    <span class="form-label">GET STARTED</span>
    <h2>Create your account</h2>
    <p>Join CVManagement and take the next step in your career.</p>
  </div>

  <form>
    <div class="form-group">
      <label for="fullName">Full name</label>
      <input
        id="fullName"
        type="text"
        name="fullName"
        placeholder="Enter your full name"
        autocomplete="name"
        required
      />
    </div>

    <div class="form-group">
      <label for="email">Email address</label>
      <input
        id="email"
        type="email"
        name="email"
        placeholder="you@example.com"
        autocomplete="email"
        required
      />
    </div>

    <div class="form-group">
      <label for="phone">Phone number <span class="optional">(Optional)</span></label>
      <input
        id="phone"
        type="tel"
        name="phone"
        placeholder="Enter your phone number"
        autocomplete="tel"
      />
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        name="password"
        placeholder="At least 8 characters"
        autocomplete="new-password"
        minlength="8"
        required
      />
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirm password</label>
      <input
        id="confirmPassword"
        type="password"
        name="confirmPassword"
        placeholder="Re-enter your password"
        autocomplete="new-password"
        required
      />
    </div>

    <div class="form-group">
      <label for="role">I want to join as</label>
      <select id="role" name="role" required>
        <option value="" disabled selected>Select your role</option>
        <option value="Candidate">Candidate</option>
        <option value="HR">HR / Recruiter</option>
      </select>
    </div>

    <label class="terms-option">
      <input type="checkbox" name="agreeTerms" required />
      <span>
        I agree to the <a routerLink="/terms">Terms of Service</a>
        and <a routerLink="/privacy">Privacy Policy</a>.
      </span>
    </label>

    <button class="submit-button" type="submit">
      Create account <span>→</span>
    </button>
  </form>

  <p class="account-prompt">
    Already have an account?
    <a routerLink="/login">Sign in</a>
  </p>
</section>
